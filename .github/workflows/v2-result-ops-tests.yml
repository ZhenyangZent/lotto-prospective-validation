name: V2 result operations tests

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install formal requirements and CI coverage tool
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "pytest-cov>=5,<8" "pyarrow>=15"

      - name: Validate frozen and formal state before tests
        shell: pwsh
        run: python security/validate_formal_state.py

      - name: Run targeted V2 result operations tests
        shell: pwsh
        run: python -m pytest tests/test_prospective_ops_v2.py -q

      - name: Run full repository tests
        shell: pwsh
        run: python -m pytest -q

      - name: Enforce operations coverage floor
        shell: pwsh
        run: python -m pytest --cov=prospective_ops_v2 --cov-report=term-missing --cov-fail-under=80

      - name: Install verified Gitleaks 8.30.1 from official release
        shell: pwsh
        run: |
          $version = "8.30.1"
          $base = "https://github.com/gitleaks/gitleaks/releases/download/v$version"
          if ($env:RUNNER_OS -eq "Windows") {
            $asset = "gitleaks_${version}_windows_x64.zip"
          } else {
            $asset = "gitleaks_${version}_linux_x64.tar.gz"
          }
          $install = Join-Path $env:RUNNER_TEMP "gitleaks-$version"
          New-Item -ItemType Directory -Path $install -Force | Out-Null
          $archive = Join-Path $install $asset
          $checksums = Join-Path $install "gitleaks_${version}_checksums.txt"
          Invoke-WebRequest -Uri "$base/$asset" -OutFile $archive
          Invoke-WebRequest -Uri "$base/gitleaks_${version}_checksums.txt" -OutFile $checksums
          $line = Get-Content -LiteralPath $checksums | Where-Object { $_ -match "\s+$([regex]::Escape($asset))$" }
          if (@($line).Count -ne 1) { throw "official checksum entry not found for $asset" }
          $expected = ($line -split "\s+")[0].ToLowerInvariant()
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Gitleaks archive checksum mismatch" }
          if ($env:RUNNER_OS -eq "Windows") {
            Expand-Archive -LiteralPath $archive -DestinationPath $install -Force
          } else {
            tar -xzf $archive -C $install
          }
          $binary = Join-Path $install $(if ($env:RUNNER_OS -eq "Windows") { "gitleaks.exe" } else { "gitleaks" })
          & $binary version
          "GITLEAKS_BIN=$binary" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Scan full Git history with redaction
        shell: pwsh
        run: |
          & $env:GITLEAKS_BIN git . --no-banner --config .gitleaks.toml --redact=100 --report-format json --report-path security/gitleaks_history_output.json

      - name: Scan worktree with redaction
        shell: pwsh
        run: |
          & $env:GITLEAKS_BIN dir . --no-banner --config .gitleaks.toml --redact=100 --report-format json --report-path security/gitleaks_worktree_output.json

      - name: Prove exact allowlist rejects neighboring secrets
        shell: pwsh
        run: ./security/validate_gitleaks.ps1 -Gitleaks $env:GITLEAKS_BIN

      - name: Revalidate formal state and prohibit evidence mutation
        shell: pwsh
        run: |
          python security/validate_formal_state.py
          git diff --exit-code -- prospective prospective_v2 prospective_validation prospective_validation_v2
